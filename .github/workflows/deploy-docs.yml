name: Deploy docs

on:
  push:
    branches:
      - main  # Set a branch name to trigger deployment
  pull_request:
  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read # access to check out code and install dependencies
  pages: write
  id-token: write

# Allow only one concurrent deployment, skipping runs queued between the run in-progress and latest queued.
# However, do NOT cancel in-progress runs as we want to allow these production deployments to complete.
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    permissions:
      pages: write      # to deploy to Pages
      id-token: write   # to verify the deployment originates from an appropriate source
      contents: write
    concurrency:
      group: ${{ github.workflow }}-${{ github.ref }}

    steps:
      - name: Checkout repo
        uses: actions/checkout@v6
        with:
          submodules: 'recursive'
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install pdoc3
      - name: Install system libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y libusb-1.0-0-dev libfftw3-dev
      # [remote] so pysdrlib.remote imports; without it that module's page would be missing
      - name: Install package
        run: python -m pip install ".[remote]"

      # No --skip-errors: a module that fails to import fails the build instead of vanishing from the docs.
      # PYSDRLIB_BUILD=auto lets the device packages build their vendor library so they import.
      - name: Build docs
        env:
          PYSDRLIB_BUILD: auto
        run: |
            python -m pdoc --html --force --template-dir pdoc_templates -o docs pysdrlib

      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './docs/pysdrlib'
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
