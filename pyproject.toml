[build-system]
requires = ["setuptools>=77.0", "numpy", "pybind11>=2.13"]
build-backend = "setuptools.build_meta"

[project]
name = "pysdrlib"
version = "0.5.0"
description = "wrapper for hardware SDRs"
readme = "README.md"
license = "GPL-3.0-or-later"
license-files = ["LICENSE"]
requires-python = ">=3.12"
authors = [
    {name = "Anonoei", email="to+dev@an0.us"}
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Natural Language :: English",

    "Topic :: Scientific/Engineering",
    "Topic :: Communications",

    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: C++",
    "Programming Language :: C",

    "Operating System :: OS Independent",
]
keywords = ["anonoei", "sdr"]
dependencies = ["numpy"]

[project.optional-dependencies]
remote = ["pyzmq", "zeroconf"]
test = ["pytest", "pybind11>=2.13", "setuptools>=77.0", "pysdrlib[remote]"]
docs = ["zensical>=0.1.3", "mkdocstrings-python>=2.0"]
# setuptools, numpy and pybind11: build_ext -i runs without build isolation; pybind11-stubgen: the extensions' .pyi
dev = ["pysdrlib[remote,test,docs]", "twine", "build", "bumpver", "setuptools>=77.0", "numpy", "pybind11>=2.13",
       "pybind11-stubgen", "matplotlib"]

[project.scripts]
pysdrlib = "pysdrlib.cli:main"

[project.urls]
Homepage = "https://github.com/Anonoei/pysdrlib"
Documentation = "https://anonoei.github.io/pysdrlib/"
Repository = "https://github.com/Anonoei/pysdrlib.git"
Issues = "https://github.com/Anonoei/pysdrlib/issues"
Source = "https://github.com/anonoei/pysdrlib"


[tool.bumpver]
current_version = "0.5.0"
version_pattern = "MAJOR.MINOR.PATCH"
commit_message = "bump version {old_version} -> {new_version}"
tag_message = "{new_version}"
tag_scope = "default"
pre_commit_hook = ""
post_commit_hook = ""
commit = true
tag = false
push = false

[tool.bumpver.file_patterns]
"pyproject.toml" = [
    'current_version = "{version}"',
    'version = "{version}"'
]
"src/pysdrlib/__init__.py" = ["{version}"]


[tool.cibuildwheel]
# glibc Linux and 64-bit Windows only; the wheels hold no vendor library, so each just needs to import
build = "cp312-* cp313-* cp314-*"
skip = "*-musllinux_* *-win32"
test-command = 'python -c "import pysdrlib; from pysdrlib.base.lib import _samples"'


[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "hardware: needs a physical device (set PYSDRLIB_HW=1)",
    "benchmark: performance checks, slow and timing sensitive (run with `pytest -m benchmark`)",
]
addopts = "-m 'not benchmark'"
