[build-system]
requires = ["setuptools>=77.0", "cython", "numpy", "pybind11>=2.13"]
build-backend = "setuptools.build_meta"

[project]
name = "pysdrlib"
version = "0.4.1"
description = "wrapper for hardware SDRs"
readme = "README.md"
license-files = ["LICENSE"]
requires-python = ">=3.12"
authors = [
    {name = "Anonoei", email="to+dev@an0.us"}
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Natural Language :: English",

    "Topic :: Scientific/Engineering",
    "Topic :: Communications",

    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: C++",
    "Programming Language :: Cython",
    "Programming Language :: C",

    "Operating System :: OS Independent",
]
keywords = ["anonoei", "sdr"]
dependencies = ["numpy"]

[project.optional-dependencies]
remote = ["pyzmq"]
dev = ["setuptools", "pyzmq", "twine", "build", "cython", "pybind11", "bumpver", "pytest", "pdoc3", "matplotlib", "pybind11-stubgen"]

[project.scripts]
pysdrlib = "pysdrlib.cli:main"

[project.urls]
Homepage = "https://github.com/Anonoei/pysdrlib"
Documentation = "https://anonoei.github.io/pysdrlib/"
Repository = "https://github.com/Anonoei/pysdrlib.git"
Issues = "https://github.com/Anonoei/pysdrlib/issues"
Source = "https://github.com/anonoei/pysdrlib"


[tool.bumpver]
current_version = "0.4.1"
version_pattern = "MAJOR.MINOR.PATCH"
commit_message = "bump version {old_version} -> {new_version}"
tag_message = "{new_version}"
tag_scope = "default"
pre_commit_hook = ""
post_commit_hook = ""
commit = true
tag = true
push = false

[tool.bumpver.file_patterns]
"pyproject.toml" = [
    'current_version = "{version}"',
    'version = "{version}"'
]
"src/pysdrlib/__init__.py" = ["{version}"]


[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "hardware: needs a physical device (set PYSDRLIB_HW=1)",
    "benchmark: performance checks, slow and timing sensitive (run with `pytest -m benchmark`)",
]
addopts = "-m 'not benchmark'"
